services:
  bili-reader:
    # Built by GitHub Actions for amd64 and arm64. To build from this checkout
    # instead, replace `image:` with `build: .`.
    image: ghcr.io/gregwym/bilinovel-reader:latest
    container_name: bili-reader
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      # Optional: password for the whole app (recommended when exposed beyond the LAN).
      APP_PASSWORD: ""
      # Optional: keys can also be entered in the app's settings.
      FISH_API_KEY: ""
      GEMINI_API_KEY: ""
      TZ: Asia/Shanghai
    # Run as the NAS user that owns the library folder:
    # user: "1000:1000"
    volumes:
      - ./data:/data # database, voice segment cache, exports
      - ./library:/library # generated audiobooks (point audiobook apps here)
